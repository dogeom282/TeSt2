<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galactic Tools 난독화기</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif; padding: 12px; margin: 0; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { font-size: clamp(22px, 5vw, 32px); margin: 8px 0 4px 0; color: #58a6ff; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .badge { background: #1f6feb; color: white; font-size: 12px; padding: 2px 12px; border-radius: 20px; font-weight: 600; }
        .subtitle { color: #8b949e; font-size: 13px; margin-bottom: 16px; }
        .row { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 768px) { .row { grid-template-columns: 1fr 1fr; } }
        .panel { background: #161b22; border-radius: 12px; padding: 12px; border: 1px solid #30363d; }
        .panel label { font-size: 12px; font-weight: 600; color: #8b949e; display: block; margin-bottom: 6px; }
        textarea { width: 100%; height: 350px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 8px; padding: 10px; font-family: 'Courier New', monospace; font-size: 13px; resize: vertical; outline: none; transition: border-color 0.2s; tab-size: 4; }
        textarea:focus { border-color: #58a6ff; }
        textarea[readonly] { background: #0d1117; opacity: 0.9; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
        .btn { background: #238636; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s, transform 0.1s; touch-action: manipulation; flex: 1; min-width: 100px; text-align: center; }
        .btn:active { transform: scale(0.96); }
        .btn:hover { background: #2ea043; }
        .btn-secondary { background: #21262d; border: 1px solid #30363d; }
        .btn-secondary:hover { background: #30363d; }
        .options { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; }
        .options label { font-size: 13px; color: #8b949e; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .options input[type="checkbox"] { accent-color: #58a6ff; width: 16px; height: 16px; cursor: pointer; }
        .stats { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 14px; background: #0d1117; border-radius: 8px; border: 1px solid #30363d; font-size: 12px; color: #8b949e; margin-top: 12px; }
        .stats span strong { color: #c9d1d9; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #238636; color: white; padding: 10px 24px; border-radius: 8px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
        .toast.show { opacity: 1; }
        .footer { margin-top: 16px; text-align: center; font-size: 11px; color: #484f58; }
        @media (max-width: 480px) {
            textarea { height: 200px; font-size: 12px; padding: 8px; }
            .btn { font-size: 13px; padding: 12px 16px; min-width: 80px; }
            .panel { padding: 8px; }
            .controls { gap: 6px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Galactic Tools 난독화기 <span class="badge">v5.1</span></h1>
    <div class="subtitle">문자열 암호화 + 변수명 난독화 + Luraph 우회</div>

    <div class="controls">
        <button class="btn" id="obfuscateBtn">⚡ 난독화 실행</button>
        <button class="btn btn-secondary" id="copyBtn">📋 복사</button>
        <button class="btn btn-secondary" id="clearBtn">🗑️ 초기화</button>
        <div class="options">
            <label><input type="checkbox" id="renameCheck" checked> 변수명</label>
            <label><input type="checkbox" id="stringCheck" checked> 문자열 암호화</label>
            <label><input type="checkbox" id="deadCheck" checked> 데드코드</label>
            <label><input type="checkbox" id="bypassCheck" checked> Luraph 우회</label>
        </div>
    </div>

    <div class="row">
        <div class="panel">
            <label>📥 원본 코드 (Luau)</label>
            <textarea id="inputCode" spellcheck="false">local function greet(name)
    print("Hello, " .. name .. "!")
    return "Welcome"
end

local result = greet("Player")
print(result)

local data = {
    x = 10,
    y = 20,
    sum = function(self)
        return self.x + self.y
    end
}

print(data:sum())</textarea>
        </div>
        <div class="panel">
            <label>📤 난독화 결과</label>
            <textarea id="outputCode" readonly spellcheck="false"></textarea>
        </div>
    </div>

    <div class="stats">
        <span>📊 라인: <strong id="lineCount">0</strong></span>
        <span>📦 크기: <strong id="sizeCount">0</strong> bytes</span>
        <span>🔀 난독화 레벨: <strong style="color:#58a6ff;">ULTIMATE</strong></span>
    </div>
    <div class="footer">⚠️ Galactic Tools · 4중 난독화 · Luraph 완전 우회</div>
</div>

<div class="toast" id="toast">✅ 완료!</div>

<script>
(function() {
    'use strict';

    const inputEl = document.getElementById('inputCode');
    const outputEl = document.getElementById('outputCode');
    const lineCountEl = document.getElementById('lineCount');
    const sizeCountEl = document.getElementById('sizeCount');
    const toastEl = document.getElementById('toast');

    // ================================================================
    // 1. Luraph 우회 코드
    // ================================================================
    const BYPASS_SNIPPET = `-- ===== Luraph Anti-Format Bypass =====
local _orig_pcall = pcall
pcall = function(...)
    local results = {_orig_pcall(...)}
    if results[1] == false and type(results[2]) == "string" then
        results[2] = results[2]:gsub(":(%d+):", ":1:"):gsub(":(%d+)%s", ":1 ")
    end
    return unpack(results)
end
-- ===== Bypass End =====
`;

    // ================================================================
    // 2. 문자열 암호화
    // ================================================================
    function encryptString(str) {
        const key = Math.floor(Math.random() * 9999999999999) + 1;
        let encrypted = '';
        let state = key;
        
        for (let i = 0; i < str.length; i++) {
            state = (state * 9301 + 49297) % 233280;
            const randomByte = Math.floor((state / 233280) * 256);
            const charCode = str.charCodeAt(i) ^ randomByte;
            encrypted += String.fromCharCode(charCode);
        }
        
        // 이스케이프 처리
        let escaped = '';
        for (let i = 0; i < encrypted.length; i++) {
            const code = encrypted.charCodeAt(i);
            if (code < 32 || code > 126 || code === 34 || code === 39 || code === 92) {
                escaped += '\\' + code.toString().padStart(3, '0');
            } else {
                escaped += encrypted[i];
            }
        }
        
        return { encrypted: escaped, key: key };
    }

    function encryptAllStrings(code) {
        let result = code;
        const stringRegex = /(["'])((?:(?!\1).)*?)\1/g;
        const matches = [];
        let match;
        
        while ((match = stringRegex.exec(code)) !== null) {
            if (match[2].length >= 2) {
                matches.push({ full: match[0], quote: match[1], content: match[2], index: match.index });
            }
        }
        
        for (let i = matches.length - 1; i >= 0; i--) {
            const m = matches[i];
            const enc = encryptString(m.content);
            
            const replacement = `(function() local s="${enc.encrypted}";local k=${enc.key};local r='';local st=k;for i=1,#s do st=(st*9301+49297)%233280;r=r..string.char((string.byte(s,i)or 0)~=math.floor((st/233280)*256))end;return r end)()`;
            
            const before = result.substring(0, m.index);
            const after = result.substring(m.index + m.full.length);
            result = before + replacement + after;
        }
        
        return result;
    }

    // ================================================================
    // 3. 데드코드 삽입 (수정됨)
    // ================================================================
    function insertDeadCode(code) {
        let result = code;
        let counter = 0;
        const lines = result.split('\n');
        const newLines = [];
        
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            newLines.push(line);
            
            // 20% 확률로 데드코드 삽입 (주석이나 빈 줄 제외)
            if (Math.random() < 0.2 && line.trim() !== '' && !line.trim().startsWith('--')) {
                counter++;
                const deadVar = '_dead' + counter;
                
                // 다양한 데드코드 패턴
                const patterns = [
                    `local ${deadVar}=${Math.floor(Math.random() * 9999)}`,
                    `local ${deadVar}="${String.fromCharCode(Math.floor(Math.random() * 26) + 97)}"`,
                    `local ${deadVar}=function() return ${Math.floor(Math.random() * 999)} end`,
                    `local ${deadVar}={${Math.floor(Math.random() * 100)},${Math.floor(Math.random() * 100)}}`,
                    `local ${deadVar}=math.random(1,${Math.floor(Math.random() * 999)})`
                ];
                
                const deadCode = patterns[Math.floor(Math.random() * patterns.length)];
                newLines.push('    ' + deadCode + ' -- dead');
            }
        }
        
        return newLines.join('\n');
    }

    // ================================================================
    // 4. 변수명 난독화 (Galactic 스타일)
    // ================================================================
    function obfuscateNames(code) {
        let counter = 0;
        const varMap = {};
        
        const reserved = new Set([
            '_orig_pcall', 'pcall', 'unpack', 'print', 'type', 'string',
            'table', 'math', 'self', 'true', 'false', 'nil', 'and', 'or',
            'not', 'function', 'local', 'return', 'if', 'then', 'else',
            'elseif', 'for', 'while', 'do', 'end', 'in', 'break', 'continue',
            'goto', 'repeat', 'until', 'require', 'loadstring', 'select',
            'next', 'pairs', 'ipairs', 'assert', 'error', 'tonumber',
            'tostring', 'setmetatable', 'getmetatable', 'rawget', 'rawset',
            'game', 'HttpGet', 'spawn', 'wait', 'task', 'Vector3', 'Instance'
        ]);

        // 식별자 찾기
        const patterns = [
            { regex: /\blocal\s+([a-zA-Z_][a-zA-Z0-9_]*)/g, group: 1 },
            { regex: /\bfunction\s+([a-zA-Z_][a-zA-Z0-9_]*)/g, group: 1 },
            { regex: /(?<![.\w])([a-zA-Z_][a-zA-Z0-9_]*)\s*[=:]/g, group: 1 },
            { regex: /(?<![.\w])([a-zA-Z_][a-zA-Z0-9_]*)(?![.\w])/g, group: 1 }
        ];

        const allIdentifiers = new Set();
        for (const pattern of patterns) {
            let m;
            const regex = new RegExp(pattern.regex.source, 'g');
            while ((m = regex.exec(code)) !== null) {
                const name = m[pattern.group];
                if (name && !reserved.has(name) && !/^\d/.test(name) && name.length > 1) {
                    allIdentifiers.add(name);
                }
            }
        }

        // 새 이름 할당 (_0x + 16진수)
        for (const name of allIdentifiers) {
            if (!varMap[name]) {
                let newName;
                do {
                    counter++;
                    newName = '_0x' + counter.toString(16).toUpperCase().padStart(2, '0');
                } while (Object.values(varMap).includes(newName) || reserved.has(newName));
                varMap[name] = newName;
            }
        }

        let result = code;
        
        // 문자열 보호
        const stringRegex = /(["'])(?:(?!\1).)*?\1/g;
        const tokenMap = {};
        let tokenCounter = 0;
        let tempResult = result.replace(stringRegex, (match) => {
            const token = `___STR${tokenCounter++}___`;
            tokenMap[token] = match;
            return token;
        });

        // 주석 보호
        const commentRegex = /--\[\[[\s\S]*?\]\]|--.*$/gm;
        const commentMap = {};
        tokenCounter = 0;
        tempResult = tempResult.replace(commentRegex, (match) => {
            const token = `___CMT${tokenCounter++}___`;
            commentMap[token] = match;
            return token;
        });

        // 치환
        for (const [oldName, newName] of Object.entries(varMap)) {
            const regex = new RegExp('\\b' + oldName + '\\b', 'g');
            tempResult = tempResult.replace(regex, newName);
        }

        // 복원
        for (const [token, value] of Object.entries(tokenMap)) {
            tempResult = tempResult.replace(token, value);
        }
        for (const [token, value] of Object.entries(commentMap)) {
            tempResult = tempResult.replace(token, value);
        }

        return tempResult;
    }

    // ================================================================
    // 5. 통계 업데이트
    // ================================================================
    function updateStats(code) {
        const lines = code.split('\n').length;
        const size = new Blob([code]).size;
        lineCountEl.textContent = lines;
        sizeCountEl.textContent = size.toLocaleString();
    }

    // ================================================================
    // 6. 토스트
    // ================================================================
    function showToast(msg) {
        toastEl.textContent = msg || '✅ 완료!';
        toastEl.classList.add('show');
        clearTimeout(toastEl._timer);
        toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    // ================================================================
    // 7. 메인 난독화
    // ================================================================
    function obfuscate() {
        const input = inputEl.value;
        if (!input.trim()) {
            showToast('⚠️ 코드를 입력해주세요!');
            return;
        }

        try {
            let output = input;
            let steps = [];

            // 1. 문자열 암호화
            if (document.getElementById('stringCheck').checked) {
                output = encryptAllStrings(output);
                steps.push('문자열 암호화');
            }

            // 2. 데드코드 삽입
            if (document.getElementById('deadCheck').checked) {
                output = insertDeadCode(output);
                steps.push('데드코드 삽입');
            }

            // 3. 변수명 난독화
            if (document.getElementById('renameCheck').checked) {
                output = obfuscateNames(output);
                steps.push('변수명 난독화');
            }

            // 4. Luraph 우회 코드
            if (document.getElementById('bypassCheck').checked) {
                output = BYPASS_SNIPPET + '\n\n' + output;
                steps.push('Luraph 우회');
            }

            outputEl.value = output;
            updateStats(output);
            showToast('✅ 난독화 완료! (' + steps.join(' + ') + ')');

        } catch (e) {
            showToast('❌ 에러: ' + e.message);
            console.error(e);
        }
    }

    // ================================================================
    // 8. 복사
    // ================================================================
    function copyOutput() {
        const text = outputEl.value;
        if (!text) {
            showToast('⚠️ 난독화된 코드가 없습니다!');
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 복사 완료!');
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        outputEl.select();
        outputEl.setSelectionRange(0, 99999);
        try {
            document.execCommand('copy');
            showToast('📋 복사 완료!');
        } catch (e) {
            showToast('❌ 복사 실패');
        }
        outputEl.setSelectionRange(0, 0);
    }

    // ================================================================
    // 9. 초기화
    // ================================================================
    function clearAll() {
        outputEl.value = '';
        updateStats('');
        showToast('🗑️ 초기화됨');
    }

    // ================================================================
    // 10. 이벤트
    // ================================================================
    document.getElementById('obfuscateBtn').addEventListener('click', obfuscate);
    document.getElementById('copyBtn').addEventListener('click', copyOutput);
    document.getElementById('clearBtn').addEventListener('click', clearAll);

    // ================================================================
    // 11. 초기 실행
    // ================================================================
    setTimeout(() => {
        obfuscate();
    }, 100);

    inputEl.addEventListener('input', () => {
        updateStats(inputEl.value);
    });

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            obfuscate();
        }
    });

})();
</script>

</body>
</html>
